name: PMS CI

# ──────────────────────────────────────────────────────────────────────────────
# WHEN does this workflow run?
#
#   1. push → main or develop
#        Happens when a PR is MERGED (merge commit is pushed to the target branch)
#        or when someone pushes directly to these branches.
#
#   2. pull_request → main or develop
#        Happens when a PR is:
#          - opened        (brand-new PR)
#          - synchronize   (new commit pushed to an existing PR)
#          - reopened      (previously closed PR re-opened)
#        This gives you a CI check on EVERY commit inside a PR, before merge.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

# ──────────────────────────────────────────────────────────────────────────────
# Concurrency guard
#   - For PRs: cancel any older run of the SAME PR (saves CI minutes)
#   - For pushes to main/develop: never cancel — let every merge run fully
# ──────────────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — BUILD & TEST
  #   Compiles the code and runs all unit/integration tests.
  #   This runs on EVERY trigger (PR check + post-merge verification).
  # ────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      # Step 1: Pull the source code into the runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Install Java 17 (Temurin) and restore the Maven cache
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Quick sanity check — confirm the right JDK is active
      - name: Verify Java version
        run: java -version

      # Step 4: Compile and run tests.
      #   clean  – removes any previous build output
      #   verify – compile → test → package → verify (full lifecycle)
      #   -B     – batch mode (no interactive prompts, cleaner CI logs)
      - name: Build and test
        run: mvn --batch-mode clean verify

      # Step 5: Save the compiled JAR as a workflow artifact.
      #   This lets the next job download it without re-building.
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pms-jar
          path: target/PMS.jar
          retention-days: 7   # keep the artifact for 7 days

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — DOCKER BUILD
  #   Builds the Docker image to prove the Dockerfile is always valid.
  #   Runs ONLY after build-and-test succeeds.
  #   Runs on EVERY trigger so PRs also validate the Docker layer.
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test   # wait for job 1 to finish successfully

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # Download the JAR produced by job 1 (no need to rebuild)
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: pms-jar
          path: target/

      # Build the Docker image using your Dockerfile
      # We tag it with the short commit SHA for traceability
      - name: Build Docker image
        run: |
          docker build \
            --tag pms-app:${{ github.sha }} \
            --tag pms-app:latest \
            .

      # Confirm the image was created successfully
      - name: Verify Docker image
        run: docker images pms-app
